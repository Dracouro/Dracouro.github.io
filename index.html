<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JINJIARAN · 个人作品站</title>
<meta name="description" content="收纳并展示我制作的 UE5 项目、3D 模型、图片、文档与思维导图——含蓝图存档可视化、C++ 源码、模型在线旋转查看与下载。" />
<!-- 图标组（2026-10-21：换成 R 标）。首页不走 BaseLayout，所以这里要自己声明一遍 ——
     否则只有浏览器"猜"的 /favicon.ico 生效，SVG 版永远轮不到。
     全部由 `node tmp/make-brand-icons.mjs` 生成，别手工换图。 -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
<link rel="manifest" href="/site.webmanifest" />
<!-- 首屏关键路径：第一屏的 WELCOME 三维字母要用 three。
     2026-10-20 起改为预加载 **tree-shaken 精简包**（scripts/build-three-letters.mjs）：
     只含本页用到的 20 个符号 + mergeGeometries，496 KB（br 104 KB），
     取代原来的 module 359 KB + core 383 KB + addons 35 KB（br 156 KB）。
     ⚠️ 这里**只能**预加载精简包 —— 同时预加载完整版等于白发请求：
        实测三个文件会一起下 1.2 MB，省下的 52 KB 原封不动还回来。
     ⚠️ 完整版仍在 importmap 的 "three" 上（第二屏 archive.js 要用），
        它会在滚到第二屏时才按需加载。
     ⚠️ importmap 的路径必须是**站点绝对路径**：相对路径（./lib/…）在根路径 `/` 下
     会解析成 `/lib/…` → 404 → 第一屏只剩一个空背景。src/pages/index.astro 里有断言守着。 -->
<link rel="modulepreload" href="/proto/lib/three-letters.r183.min.js" />
<script type="importmap">
{
  "imports": {
    "three": "/proto/lib/three.module.min.js",
    "three/addons/": "/proto/lib/addons/"
  }
}
</script>
<!-- 「直接落到第二屏」标记（2026-09-22 加）。
     详情页（以及其它走站内导航的页面）右上角的「首页」现在指向 `/?browse` ——
     那条路径要的是**第二屏**（滚轴选盒体那屏），不是第一屏的三维字母。
     这里刻意放在解析 <body> 之前：先给 <html> 打标记，下面的 CSS 才能从**首帧**
     就把第一屏藏掉，不然会"闪一下字母屏再进第二屏"。
     ⚠️ 和那 10 个 ?xxx 调试出口不同，这是**真功能**，交付时不要跟着一起删。
     为什么用 <html> 上的类而不是 <body>：<body> 这时还不存在。 -->
<script>
  try {
    if (new URLSearchParams(location.search).has('browse')) {
      document.documentElement.classList.add('direct-browse');
    }
  } catch (err) {
    /* 读不到 query（异常环境）就当普通入口 —— 退回老行为，不值得把首页拖垮 */
  }
</script>
<style>
  /* ============================================================
     概念原型：新首页结构
       第一屏（stage）：顶部「文字滚动条」+ 液体玻璃 hover
       第二屏（browse）：RhineLabUI 式「滚轴选页」= 纵向瀑布 + 右侧详情
       衔接（handoff）：第一屏缩退 / 第二屏升起（igloo 式"潜入"）
       点击选中项 → 详情过渡（View Transitions 共享元素形变，igloo 式）
     ------------------------------------------------------------
     2026-09-18：本文件**已经是根路径 `/` 的唯一来源** —— src/pages/index.astro
     在构建期把这份文件原样内联（不做任何改写），所以改这里 = 改首页。
     `/proto/home.html` 仍可单独打开，用于和线上做 A/B 对照。
     正因如此，下面所有资源一律写成**站点绝对路径**（/proto/three-archive/…），
     两个入口（/ 与 /proto/home.html）解析结果一致，不依赖页面所在层级。
     ============================================================ */

  /* ============================================================
     主界面 → 接管层的「渐变过渡」
     ------------------------------------------------------------
     为什么要 @property：普通的 linear-gradient 里，色标百分比**不可插值** ——
     写 transition 也不会动。把它提升成一个注册过的自定义属性（syntax: <percentage>）
     之后，浏览器才肯对它的数值做插值，于是"渐变带扫过整屏"这件事能用一条
     transition 表达，而不是靠 JS 每帧改 style。
     ============================================================ */
  @property --reveal {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 0%;
  }

  :root {
    --bg: #0b0f14;
    --surface: #151b23;
    --surface-2: #1c232d;
    /* 2026-09-19 按要求：文字**统一纯白**（正文/次级/三级三档全改 #fff）。
       起因：第二屏的字是压在亮色三维卡上的，--fg-3 (#6d7787) 在那种底上基本看不见。
       ⚠️ 层级现在只靠字号 + 字重表达，不再靠颜色深浅；
          要还原成"三档灰"就把 --fg-2/--fg-3 改回 #a2acb9 / #6d7787。 */
    --fg: #ffffff;
    --fg-2: #ffffff;
    --fg-3: #ffffff;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --accent: #6a9bff;
    --accent-soft: rgba(106, 155, 255, 0.14);
    --radius: 14px;
    /* 版心宽度 —— .wrap 与顶部那层（.browse-top）共用同一个数，
       所以导航的右边缘永远落在版心线上，改一处两处一起动。
       ⚠️ 2026-09-19：第二屏不再用这个 1180 版心，改用下面的 --sheet-pad（见 .wrap 注释）。
          这两个数先留着（`/classic` 与其它页面各有一套自己的），别删。 */
    --wrap-max: 1180px;
    --wrap-pad: 20px;
    /* 第二屏的「贴边留白」：mockup#2 里大标题贴左、预览框与「查看详情」箭头共用同一条
       右边缘，而那条右边缘距视口 62px（不是版心线）。
       ⚠️ 1920 宽下算出来正好 61.4px —— 这是照 mockup 反推的档位，改它等于改取景。 */
    --sheet-pad: clamp(20px, 3.2vw, 62px);
    /* 第二屏「栏目大标题」的字号 —— 用户 2026-09-19 要求「放大三倍」：
       基准是原 h2 的 `clamp(40px, 6.6vw, 84px)`，这里 vw 与上限都 ×3（下限另按窄屏收）。
       抽成变量是因为「放大后竖向再压 0.5 倍」那步要按同一个数算留白，改一处即可。 */
    --title-size: clamp(120px, 19.8vw, 252px);
    /* 大标题的「竖向压缩系数」——放大三倍之后再乘这个数，就是最终字高。
       0.5   → 净高 1.5 倍（2026-09-19 首版，用户反馈"有些太扁了"）
       0.6667 → 净高 **2 倍**（2026-09-19 22:39 用户拍板，2/3）
       ⚠️ 改这一个数就行：下面 h2 的负 margin 是用 `(系数 - 1)` 现算的，会自动跟着变。 */
    --title-squash: 0.6667;
    /* 第二屏标题栏的上移量（见 .browse-head 注释）。之所以要抽成变量 + 按视口高度分档：
       `.browse` 是垂直居中的，内容越矮、被推得越靠下，所以同一段位移在不同屏高上
       效果差别很大；矮视口（≤900px）必须收着用，否则标题会被顶到视口上沿之外。 */
    /* 上移量 = −(用户要的位移 50px) − (内容高度相对"原图片版"的变化量 / 2)。
       内容高度会随标题字号/压缩系数变，所以**每次改标题尺寸都要重算这一项**。
       原始基准：图片版内容 837px。
       ① 图片→文字(高126) 时内容 754 → −(754−837)/2 = +41.5 → −91.6
       ② 压缩系数 0.5→0.667（标题高 126→168，内容 754→796）→ −(796−837)/2 = +20.5 → **−70.6**
       ⚠️ 不补这一项的话，改标题尺寸会顺带把标题栏自己挪位置（②这步实测被推高了 21px）。 */
    --head-lift: -70.6px;
    /* motion tokens（取自 motion-web，收敛到 MeWeb） */
    --dur-fast: 180ms;
    --dur-std: 320ms;
    --dur-med: 480ms;
    --dur-slow: 760ms;              /* 整屏级过渡（进场/退场）专用 */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-dive: cubic-bezier(0.32, 0, 0.16, 1);   /* 更"沉"的一条，配渐变扫过 */
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    overflow-x: clip;
  }

  /* ============================================================
     第一屏 —— 空舞台 + 顶部文字滚动条（液体玻璃）
     ============================================================ */
  .stage {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;      /* 跑马灯要贴顶，不能居中 */
    padding-top: clamp(28px, 9vh, 104px);
    overflow: hidden;
    isolation: isolate;
  }

  /* 第一屏（WELCOME）背景图 —— 2026-09-19 加。
     为什么这么简单就够：字母画布是 alpha:true 的**透明**层（见下面 new THREE.WebGLRenderer），
     场景里没有 scene.background / 雾 / 清屏色，所以画布只画那几片字母，其余像素全透明 ——
     在这里放一张图，字母自然就浮在图上，**不用动任何 WebGL 代码**。
     换图：把图覆盖到 public/proto/bg/welcome.png + welcome.webp 两个文件（**两个都要换**）。
     2026-10-20：加了 WebP 孪生（37 KB → 16 KB，首屏关键路径 -21 KB）。用 image-set 做格式协商，
     支持 WebP 的浏览器只下 webp，老浏览器回落到下面那行 PNG，**不会重复下载**。
     ⚠️ 路径必须是站点绝对路径（/proto/…）—— 见 src/pages/index.astro 的"零改写"约束，
        写 ./bg/… 时 /proto/home.html 看着正常、只有线上根路径是坏的。
     不想用背景图：整块删掉即可（或把 background-image 改回 none）。 */
  .stage {
    background-image: url('/proto/bg/welcome.png');   /* 兜底：不支持 image-set 的浏览器 */
    background-image: image-set(
      url('/proto/bg/welcome.webp') type('image/webp'),
      url('/proto/bg/welcome.png') type('image/png')
    );
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* 第一屏的字母画布。
     用 absolute + inset:0 填满 .stage（它是 relative），而不是 fixed 贴视口 ——
     这样 onScroll / diveOut 写在它上面的 scale / opacity 会跟第一屏一起"沉入景深"，
     不需要再单独驱动一次三维。will-change 是因为这两个属性会被逐帧改。 */
  .letter-stage {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
    will-change: transform, opacity;
  }
  .letter-stage canvas { display: block; width: 100%; height: 100%; }

  /* ---------- 米米世界入口（点 WELCOME 字母 → 围成圆环 → 中间浮出方块图标） ----------
     2026-10-19 加。为什么是 DOM 而不是三维物体：
       ① 图标下面那行「米米世界.exe」要清晰可读、可选中，三维里做文字得另拉字体/贴图；
       ② 点击目标得是 <button>，天然可聚焦、可被 Enter 触发、屏幕阅读器能念出来；
       ③ 只在环形排列时出现，直线排列时必须**彻底不可点**（pointer-events:none）——
          否则它会横在第一屏中间，把任意位置的点击都吃掉。
     三种"不可点"要一起关：opacity 只解决"看不见"，pointer-events 解决鼠标，
     tabindex/aria-hidden 解决键盘与读屏。 */
  .world-entry {
    position: absolute;
    inset: 0;
    z-index: 3;                        /* 压住字母画布(1)，被左上角品牌(4)压住 */
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;              /* 隐藏时不吃事件 */
    opacity: 0;
    transform: translateY(12px) scale(0.94);
    transition: opacity 340ms var(--ease-out), transform 340ms var(--ease-out);
  }
  .world-entry.is-open { opacity: 1; transform: none; }

  .world-entry-btn {
    /* <button> 的 UA 默认样式全清掉 */
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    pointer-events: none;              /* 由 .is-open 打开，见下 */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.4vh, 18px);
    border-radius: 16px;
  }
  .world-entry.is-open .world-entry-btn { pointer-events: auto; }

  .world-entry-icon {
    display: block;
    /* 尺寸要跟着"圆环的洞"走，不能只看视口高度：
       环形排列的世界半径固定 2.55，手机竖屏（390×844）上整圈投影下来直径只有 ~236px，
       洞内径约 186px —— 只按 19vh 算会得到 160px，图标几乎顶到字母上。
       所以取 min(视口高度, 视口宽度的 30%)：横屏 1440×900 仍是 180px（不受影响），
       竖屏自动收到 117px，四面都留出气口。 */
    width: clamp(84px, min(20vh, 30vw), 208px);
    height: auto;
    image-rendering: pixelated;        /* 像素画：放大别糊 */
    transition: transform 220ms var(--ease-out), filter 220ms var(--ease-out);
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.45));
  }
  .world-entry-btn:hover .world-entry-icon,
  .world-entry-btn:focus-visible .world-entry-icon {
    transform: translateY(-5px) scale(1.045);
    filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.6));
  }
  .world-entry-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 10px; }
  /* 按下时给一点回弹，说明"这一下点到了" */
  .world-entry-btn:active .world-entry-icon { transform: scale(0.97); }

  .world-entry-name {
    margin: 0;
    font-size: clamp(12px, 1.5vh, 17px);
    letter-spacing: 0.06em;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
    user-select: none;
  }

  /* 直接落到第二屏时（`/?browse`，标记由 <head> 里那段小脚本打），第一屏整块不露脸。
     用 visibility 而不是 display：.stage 是 100svh 的文档流元素，display:none 会把它
     从布局里摘掉（高度变 0），而后面 `stage.offsetHeight || window.innerHeight` 这类
     按屏高算阈值的代码就全靠兜底了 —— 留着布局，语义干净。
     letterStage 的 clientWidth/Height 同样不受影响（visibility 不动布局），
     所以延后构建的字母场景量尺寸也是准的。 */
  html.direct-browse .stage { visibility: hidden; }

  /* 第一屏原来那条「文字滚动条」（跑马灯 + 液体玻璃底座 + 跟随指针的镜面高光）
     在 2026-09-18 换第一屏时整块撤掉了 —— 第一屏现在是 WELCOME 三维字母。
     一起撤掉的规则：.marquee / .marquee:hover / .track / .track .word / .track .dot /
     .sheen / @keyframes marquee，以及再上面那团极光 .aurora / @keyframes drift。
     要找回来：tmp/backup/home.pre-letters.html（有完整旧版）。 */

  /* 左上角品牌 —— 2026-09-20 起**是一个可点的按钮**：LOGO_WHITE.png + 名字「金佳燃」，
     点它就地弹出个人简介小窗（`.meview`，**不跳页**）。
     三条版式要求来自用户：
       ① 名字字号 = logo **渲染高度的一半**；② 紧挨着 logo；③ 名字**底边**与 logo 底边对齐。
     第三条用 `align-items: flex-end` —— 不用 baseline：logo 是图片，没有文字基线可对。

     ⚠️ 2026-09-20 晚：用户要求**删掉玻璃底**（"把左上角 logo 按钮下面的玻璃底删掉"）——
        原来的 `.stage-brand::before`（宽 200% 的胶囊 + blur(14px) 玻璃 + 呼吸动效）
        连同 `@keyframes brandBreathe`、hover/窄屏/reduced-motion 那几条 ::before 规则一起撤了；
        `isolation: isolate` 也删了，它本来只为托住 `z-index:-1` 的玻璃底。
        现在是**纯 logo + 名字**：悬停反馈只剩名字上那层柔光，键盘聚焦仍是描边。
        ⚠️ 若以后要加回任何"底"：本元素**不能有 padding**，否则 `width:200%` / `height:100%`
           量的会是含 padding 的外盒，跟"2 倍 / 一致"对不上。
        找回旧版：tmp/backup/home.html.20260920-022308.bak。 */
  .stage-brand {
    /* logo 宽度基准 —— 名字字号也按它算，抽成变量一处改两处跟。
       mockup#1 实测 logo 可见宽 203px @1920（=10.6% 屏宽），几乎贴着左上角（边距 1~5px）。 */
    --logo-w: clamp(104px, 10.6vw, 204px);
    position: absolute;
    top: clamp(8px, 1.1vh, 16px);
    left: clamp(10px, 0.95vw, 18px);
    z-index: 4;                     /* 必须压过字母画布（.letter-stage 是 z-index:1） */
    display: inline-flex;
    align-items: flex-end;          /* ③ 名字底边贴 logo 底边 */
    gap: clamp(5px, 0.45vw, 11px);  /* ② 紧挨着，只留一点气口 */
    padding: 0;
    /* <button> 的 UA 默认样式要全清掉 —— 不清的话它会带自己的背景/边框/字体。 */
    background: none;
    border: 0;
    font: inherit;
    color: #fff;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
  }
  .stage-logo {
    display: block;
    width: var(--logo-w);
    /* 素材 524×438 自带透明通道 → 渲染高 = 宽 × (438/524) ≈ 宽 × 0.836 */
    height: auto;
    user-select: none;
  }
  .brand-name {
    /* ① 字号 = logo 渲染高的一半 = 宽 × 0.836 ÷ 2 ≈ 宽 × 0.418 */
    font-size: calc(var(--logo-w) * 0.418);
    line-height: 1;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
    color: #fff;
    transition: text-shadow var(--dur-med) var(--ease-out);
  }

  /* 悬停 / 键盘聚焦反馈 —— 玻璃底删掉后只剩这两条：
     鼠标悬停时给名字加一层柔光；键盘聚焦时给外描边（`:focus-visible` 只在键盘导航时触发，鼠标点击不会）。 */
  .stage-brand:hover .brand-name { text-shadow: 0 0 18px rgba(255, 255, 255, 0.6); }
  .stage-brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* 第一屏底部的「向下翻页」提示 —— 2026-09-19 换成 DOWN.png。
     DOWN.png 是左右两枚 X（中间留空），文字正好落在中间的空档里。
     整体做一个很轻的上下浮动（±6px）提示可以往下滚，刻意不做夸张动效。 */
  .stage-foot {
    position: absolute;
    left: 0; right: 0;
    /* mockup#1 实测：DOWN.png 底边距视口下沿 32px @960 高 */
    bottom: clamp(14px, 3.3vh, 36px);
    z-index: 2;
    display: flex;
    justify-content: center;
    color: var(--fg-3);
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .foot-marker {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    animation: footBob 2.2s ease-in-out infinite;
  }
  /* 素材 419×88 原生尺寸渲染（mockup#1 实测整条 415px @1920），不再缩小 */
  .foot-marker img { display: block; width: clamp(220px, 21.8vw, 419px); height: auto; opacity: 0.9; }
  /* 文字落在左右两枚 X 中间的空档里（素材中间 60% 是全透明的），约 12px */
  .foot-marker span {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    font-size: clamp(10px, 0.63vw, 12px);
  }
  @keyframes footBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .foot-marker { animation: none; } }

  /* ============================================================
     第二屏 —— 滚轴选页：按种类分列（每列一条纵向瀑布）+ 右侧详情
     ============================================================ */
  /* 卷轴「接管层」：滚下去进入后固定盖满整屏，全盘接管滚轮 */
  .browse-spacer { height: 100svh; }
  /* 接管层：不再是"整体 opoacity 淡入"，而是**自上而下的渐变揭示**。
     遮罩 = linear-gradient(to bottom, #000 (reveal-band), transparent reveal)：
       · --reveal = 0%   → 实心区在 -28%（即屏幕上方之外），整层被透明覆盖 = 完全不可见
       · --reveal = 128% → 实心区到 100%，渐变带落在屏幕下沿之外 = 完全显形
     中间过程就是一条 28% 高的软带自上而下扫过，把第一屏"化开"成接管层。
     比整体淡入更接近 igloo 那种"潜入"的观感：光是扫过去的，不是整块浮上来的。 */
  .browse {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    /* 上下留白收了一档（96/48 → 86/38 @960）：放大后的预览 + 大字说明把内容堆高了，
       不改的话底部那行 .reel-hint 会被 overflow:hidden 裁掉。 */
    padding: clamp(60px, 9vh, 96px) 0 clamp(24px, 4vh, 44px);
    background: var(--bg);
    --reveal: 0%;
    transform: translateY(2.5%);          /* 很轻的下沉，只为了有点纵深，不再用 7% */
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(var(--reveal) - 28%), transparent var(--reveal));
            mask-image: linear-gradient(to bottom, #000 calc(var(--reveal) - 28%), transparent var(--reveal));
    transition: --reveal var(--dur-slow) var(--ease-dive),
                transform var(--dur-slow) var(--ease-dive);
  }
  .browse.active {
    --reveal: 128%;
    transform: none;
    pointer-events: auto;
  }
  /* 揭示跑完之后把遮罩摘掉。
     不是为了好看，是为了**性能**：遮罩层里是实时渲染的 WebGL 画布，
     留着 mask 会让合成器每帧都多做一次遮罩合成；揭完就没必要继续付这个钱。 */
  .browse.revealed { -webkit-mask-image: none; mask-image: none; }

  /* ============================================================
     三维档案阵列层（叠加在接管层底部，整屏铺满）
     ------------------------------------------------------------
     为什么整屏铺满、而不是塞进左栏那块：
       · 原版 RhineLabUI 的阵列本来就是"整屏白棚里的一整面档案墙"，塞进一个
         760×520 的小格子里会让 1920×1080 舞台缩放到很小、卡片挤成一团；
       · 已定稿的取景微调（左移 320 / 下移 114）本来就是按"整屏 + 面板浮在右侧 +
         返回条浮在顶部"量出来的，铺满整屏这些数才成立。
     DOM 版的卷轴不去掉，只是让位（无 WebGL / 加载失败时它就是回退）。
     ============================================================ */
  .arch3d {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0;
    transition: opacity var(--dur-med) var(--ease-out);
  }
  .arch3d > canvas { display: block; }
  .arch3d.ready { opacity: 1; }
  /* 三维在场时，DOM 卷轴让位。
     ⚠️ 必须用 visibility 而不是 display：卷轴占着 .browse-grid 的第一列（1fr），
     一旦 display:none，那一列就塌了，右侧面板会被挤到左边 —— 已定稿的取景微调
     （左移 320）正是按"面板在右边 1150→1530"量的，面板一挪位整套数就废了。 */
  .browse.has3d .cols-viewport { visibility: hidden; }
  /* 三维载入提示（模型有 7 MB，冷启动要等几秒）
     ⚠️ 它是 .browse 的直接子元素，**不在 .arch3d 里** —— .arch3d 是 opacity:0、
     要三维就绪才变 1，提示放里面就是永远看不见（见标记处的注释）。
     正因为它在外层，z-index 必须自己盖过内容层 .browse .wrap(1)，取 2。

     落点：**顶部返回条与内容标题之间那条空白带**，不是屏幕正中。
     正中是 DOM 卷轴的卡片区 —— 提示会正好压住一张卡（实测居中压 4478 px²、
     底部各档 1200~4000 px²，而这条带是 **0**）。
     基准与 .browse-top 的 top 同一公式，视口高度变了整条带跟着走。
     +96 是量出来的：1440×900 / 1920×1080 / 390×844 三档都落在零重叠区
     （移动端上这条带更窄，96 会压到站内导航、140 会压到「6 个条目」那行，只有 118 这档干净）。 */
  .arch3d-status {
    position: absolute;
    left: 50%;
    top: calc(clamp(12px, 2.6vh, 24px) + 96px);
    transform: translateX(-50%);
    z-index: 2;
    pointer-events: none;        /* 纯提示，不挡下面卷轴的点击/滚动 */
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg-2); font-size: 13px;
    transition: opacity 320ms var(--ease-out);
  }
  /* ⚠️ 收掉时除了 opacity 还要 visibility:hidden —— 只做 opacity:0 的话，
     这段文字**仍留在页面的 innerText 里**（innerText 认 visibility、不认 opacity），
     于是首页的文本里永远挂着一句"三维阵列载入中…"：搜索引擎、读屏、复制粘贴都会带上它。
     同一个坑之前在 #boot 的 LOADING 上踩过一次。
     visibility 延后 320ms 再翻，否则淡出会被腰斩。 */
  .arch3d-status.done {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 320ms var(--ease-out), visibility 0s linear 320ms;
  }
  .arch3d-status .spin {
    width: 13px; height: 13px; flex: none;
    border: 2px solid var(--line-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: archspin 0.9s linear infinite;
  }
  .arch3d-status.done .spin { display: none; }
  @keyframes archspin { to { transform: rotate(360deg); } }
  /* 内容层浮在三维之上（返回条自己的 z-index 更高，见上） */
  .browse .wrap { position: relative; z-index: 1; }

  /* ============================================================
     顶端那一层：**居中的返回条** + **靠右的站内导航**
     ------------------------------------------------------------
     结构：.browse-top 是一整行（absolute 贴顶、flex 居中），
       返回条是它唯一参与布局的孩子 → 居中由 flex 保证，不会被导航挤偏；
       导航绝对定位在这一行的右侧 → 完全不参与返回条的布局。
     为什么这点较真：三维取景的 ?pan=370,280 是**照返回条的位置**调出来的
       （让预选主卡避开返回条与右侧面板）。返回条一旦被挤偏，取景就白调了。
       实测改造前后返回条都是 x=660.2 y=24 119.6×42.9，中心 720.0 正中。
     ------------------------------------------------------------
     导航右边缘对齐「版心线」而不是视口边（padding-inline 用与 .wrap 同一套公式），
       否则宽屏下它会浮在版心外面，看着散。
     ============================================================ */
  .browse-top {
    /* ⚠️ absolute 子元素的含块是祖先的 **padding box**，祖先的 padding 推不开它。
       所以导航不能写 right:0，得自己用同一个公式缩进 —— 抽成 --edge 一处维护。
       （踩过：写 right:0 时导航右边线贴在视口边上 = 1440，而不是版心线 1290。） */
    --edge: var(--sheet-pad);
    position: absolute;
    top: clamp(12px, 2.6vh, 24px);
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    justify-content: center;
    padding-inline: var(--edge);
  }

  /* 顶端返回条 —— 唯一的出口，最外层也做成液体玻璃。位置交给上面的 flex，自己不再定位 */
  .return-bar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 20px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.06);
    -webkit-backdrop-filter: blur(14px) saturate(170%);
    backdrop-filter: blur(14px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 12px 40px -20px rgba(0, 0, 0, 0.85);
    color: var(--fg);
    font: inherit;
    font-size: 13.5px;
    cursor: pointer;
    transition: background var(--dur-fast) linear, border-color var(--dur-fast) linear;
  }
  .return-bar:hover { background: rgba(255, 255, 255, 0.13); border-color: rgba(255, 255, 255, 0.32); }
  .return-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 站内导航（.topnav / 那组「项目 图片 文档 3D 模型 关于」）已于 2026-09-19 按要求删除：
     标记与样式一起撤掉，第二屏现在只有顶部居中的「返回主界面」一个出口。
     要找回来：tmp/backup/home.pre-welcome-bg.html 里有整套。 */

  /* 接管期间锁住页面滚动，连触控板的橡皮筋也一起挡掉 */
  body.browsing { overflow: hidden; overscroll-behavior: none; }

  /* ⚠️ 2026-09-19：.wrap 目前**只被第二屏用**（`grep 'class="wrap"'` 只有一处），
     所以这里直接把它从"1180 居中版心"改成"贴着视口两侧、只留一条窄边"。
     原因是 mockup#2 要求把右侧预览放大到 709×389 @1920（≈37vw），
     塞进 1180 版心会把左边的卷轴挤到只剩 430px。 */
  .wrap { width: 100%; max-width: none; margin-inline: 0; padding-inline: var(--sheet-pad); }

  /* 标题栏「整体上移」（2026-09-19 两次累加：先 20px，再 +30px → 用户要的位移 = 50px，
     外加 41.6px 的居中补偿，合计 -91.6px。下详。）
     ⚠️ 必须用 position/top 这种**不参与布局**的挪法：
     ① 写 `margin-top` 会把它后面的兄弟节点（卷轴…）一起拽走，还会改变 `.col-main` 的高度；
     ② `.col-main` 是 grid item（独立格式化上下文），负 margin 不外泄，只改它自己的高度。
     ⚠️ **那 41.6px 的补偿是怎么来的**：`.browse` 是 `overflow:hidden` + `justify-content:center`，
        内容比容器矮时会被**垂直居中**。大标题从 209px 高的图片换成 126px 高的文字后，
        `.col-main` 从 837 掉到 754，居中就把整块内容**往下推了 41.6px**
        （实测 head 顶边 85.4 → 127.0）。不减掉这一项，用户要的"再上移 30px"
        在屏幕上会表现为"标题反而下沉 11.6px"。
     ⚠️ **判据**：head 的视觉 top 应 = 上一版位置 − 30（上一版 65.4 → 现在的目标 35.4）。
        内容高度一变（改字号/改卷轴高/标题换行）这个数就得重新量，别当常数。
     ⚠️ **矮视口要收着用**：`.browse` 是垂直居中的，内容越矮被推得越靠下；
        1366×768 下上一版的 head 就已经贴到 y=6.7，物理上不可能再上移 30px，
        硬上就会把大标题顶出视口上沿（实测 -23.6）。所以下面按 max-height 分档递减。 */
  .browse-head { position: relative; top: var(--head-lift); margin-bottom: 20px; }

  /* 上移量的分档保护（配合 :root 的 --head-lift）。
     数值由"head 视觉 top 必须为正、且尽量贴近上一版 − 30"两条约束反推：
     ≥901px 用满；801~900 收到 -62；≤800 收到 -34。 */
  @media (max-height: 900px) { :root { --head-lift: -62px; } }
  @media (max-height: 800px) { :root { --head-lift: -34px; } }
  /* 720 高度这档再收一次：-34 会让 head 顶到 y=1.6（"全部内容"那行贴死视口上沿，像 bug）。
     ⚠️ 这档本来就已经"内容正好铺满、余量 0"，属既有现象，不是这次改出来的。 */
  @media (max-height: 740px) { :root { --head-lift: -18px; } }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-3); margin: 0 0 6px;
  }
  .head-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  /* 大标题 = 纯文字（2026-09-19 用户拍板：**不再使用图片**，
     第一栏「项目」和其余栏目走完全一样的文字标题）。
     原来的「有素材的栏目用图片」机制（`.col-title-img` + JS 里的 COL_TITLE 映射表）已整体删除。 */
  /* 大标题字号：`--title-size` 已经是"其余栏目标题文字的 3 倍"（见 :root）。
     再按 `--title-squash` 竖向压缩 → 现在是 **宽 ×3 / 高 ×2**（0.6667 × 3）。
     ⚠️ 压扁只能靠 transform —— 字号没法只压一个方向。
     ⚠️ 而 transform **不参与布局**：压缩后视觉高度只剩一部分，布局盒却还是整行高，
        所以必须用等量的负 margin 把多出来的那部分行高"还回去"，
        否则标题与标签行之间会凭空多出一段空白。
        负值 = 字号 ×(系数 − 1)，由变量现算，以后只改 :root 那个系数即可。 */
  .browse-head h2 {
    font-size: var(--title-size);
    line-height: 1;                        /* =1 才让"压掉的高度"精确等于 (1 - 系数) 个字号 */
    white-space: nowrap;                   /* 标题一律不换行 —— 一换行上面的 top 补偿量就失效了 */
    /* 负 margin 把"压掉的那部分行高"还给布局。系数由 --title-squash 控制，
       这里写 (系数 − 1) 而不是写死的 -0.5，改压缩系数时不用回来改这里。 */
    margin: 0 0 calc(var(--title-size) * (var(--title-squash) - 1));
    font-weight: 800; letter-spacing: -0.03em;
    transform: scaleY(var(--title-squash));
    transform-origin: left top;            /* 从顶端压：压扁后的字形仍顶住标题行上沿 */
  }
  .browse-head h2[hidden] { display: none; }
  .col-count { font-size: 13px; color: var(--fg-3); }

  /* 标签行：栏目标签在左，左右切换按钮（.colswitch）在右 */
  .head-tabs-row { display: flex; align-items: center; gap: 16px; margin-top: 16px; }

  /* 列切换控件：左右按钮（主入口）+ 栏目名标签（点一下直接跳过去） */
  /* 2026-09-19：从「标签行右端」挪到「提示行正上方」。它现在是 .col-main 的独立一块，
     不再在 flex 行里，所以 margin-left:auto（靠右）没意义了，改掉。 */
  .colswitch { display: inline-flex; align-items: center; gap: 10px; margin: 14px 0 0; flex: none; }
  .colnav {
    width: 42px; height: 42px; flex: none;
    display: grid; place-items: center;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--fg); font: inherit; font-size: 17px; line-height: 1;
    cursor: pointer;
    transition: background var(--dur-fast) linear, border-color var(--dur-fast) linear,
                transform var(--dur-fast) var(--ease-out);
  }
  .colnav:hover { background: var(--surface-2); border-color: var(--accent); }
  .colnav:active { transform: translateY(1px); }
  .colnav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .colpos { font-size: 14px; color: var(--fg-3); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }

  .coltabs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; }
  /* mockup#2 里这行栏目标签明显比原来（19px 上限）大一档，实测 ≈ 32px；
     未选中的颜色也从 --fg-3 提到 --fg-2 —— 字号放大后它正好压在亮色三维卡上，
     --fg-3 在那种底上基本看不见（mockup 里四个标签都是亮的）。 */
  .coltab {
    padding: 8px 18px; border-radius: 999px;
    border: 1px solid transparent; background: transparent;
    color: var(--fg-2); font: inherit; font-size: clamp(17px, 1.85vw, 32px);
    cursor: pointer;
    transition: color var(--dur-fast) linear, background var(--dur-fast) linear, border-color var(--dur-fast) linear;
  }
  .coltab:hover { color: var(--fg); }
  .coltab[aria-selected='true'] {
    color: var(--fg); background: var(--accent-soft); border-color: rgba(106, 155, 255, 0.5);
  }
  .coltab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .browse-grid {
    display: grid;
    /* 右栏再放大一档：mockup#2 里的「(图片占位)」是 709×389 @1920（=36.9% 屏宽、16:9）。
       配合 .wrap 改成贴边版式后，左栏仍能剩 ~1000px 给卷轴。
       ⚠️ 三维阵列（.arch3d）是绝对定位铺满 .browse 的，不受这里影响；
       但面板变宽后可能会和已调好的取景微调（pan 370,280）在视觉上更挤，
       真觉得挤就重跑 tmp/lusion/probe-pan.mjs 换档。 */
    grid-template-columns: minmax(0, 1fr) minmax(320px, 36vw);
    gap: 30px;
    align-items: start;
    /* 2026-09-19 按要求：右侧展示栏（含预览图）整体**再左移 30px**。
       用 padding-right 而不是给 .panel 加 margin-right —— 后者会把右栏自身压窄，
       这里是"宽度不变、只挪位置"，所以得从格子的内容盒右边界上让。 */
    padding-right: clamp(0px, 1.6vw, 30px);
  }
  /* 左栏：标题栏 / 卷轴 / 提示行竖着叠。min-width:0 是 minmax(0,1fr) 里
     "别让内容撑破格子"的前提（少了它长标题会把右栏挤出去）。 */
  .col-main { min-width: 0; }

  /* 栏目轨道：一列 = 一个种类。整条轨道横向平移，一屏只显示当前列。 */
  .cols-viewport { overflow: hidden; min-width: 0; }
  .cols {
    display: flex;
    align-items: flex-start;
    transition: transform var(--dur-med) var(--ease-out);
    will-change: transform;
  }
  .col { flex: 0 0 100%; min-width: 0; }

  /* 每列内部的纵向「卷轴」—— RhineLabUI 的滚轴选页，改成纵向 + 无限循环
     条目是绝对定位的 DOM，纵向位置由 JS 每帧写 transform（不走原生滚动，
     这样才能"取模回绕"、滚不到底）。 */
  .reel {
    position: relative;
    /* 520 → 440 → 410：左栏现在要装标题栏（标题图 209px 高）+ 卷轴 + 左右按钮 + 提示行，
       960 高的视口里每加一行都得从卷轴身上让，否则底部的提示行会被挤出屏幕。 */
    height: min(44svh, 410px);
    overflow: hidden;
    outline: none;
    cursor: ns-resize;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 20%, #000 80%, transparent);
    mask-image: linear-gradient(180deg, transparent, #000 20%, #000 80%, transparent);
  }
  /* ⚠️ 矮视口让位：卷轴是左栏里最大的一块，而且**三维就绪后它就被阵列盖住、根本看不见**
     （`has3d`），所以矮屏上收它没有任何视觉代价，却能给"三倍大 + 压扁"的标题腾出空间。
     不收的话 1280×720 下内容会超出视口、底部提示行被 `overflow:hidden` 裁掉 21px。
     ⚠️ 这几条必须写在 .reel 基础规则**之后** —— 媒体查询不提升优先级，
        同优先级比的是源码先后，写前面会被上面那条 `min(44svh,410px)` 覆盖掉。 */
  @media (max-height: 820px) { .reel { height: min(38svh, 360px); } }
  @media (max-height: 700px) { .reel { height: min(30svh, 260px); } }
  .item {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 72px;
    margin-top: -36px;
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: inherit;
    text-align: left;
    cursor: pointer;
    font: inherit;
    will-change: transform, opacity;
    transform-origin: center;
    backface-visibility: hidden;
    /* transform 由 JS 每帧写，所以这里只过渡描边/底色 */
    transition: border-color var(--dur-fast) linear, background var(--dur-fast) linear;
  }
  .item .no { font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .item .name { font-weight: 600; }
  .item .sub { display: block; color: var(--fg-3); font-size: 13px; margin-top: 3px; font-weight: 400; }
  .item .chip {
    font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--fg-2); background: var(--surface-2);
    white-space: nowrap;
  }
  /* 选中项：荧光边（它永远停在卷轴正中） */
  .item[aria-current='true'] {
    border-color: rgba(106, 155, 255, 0.6);
    background: rgba(106, 155, 255, 0.12);
  }
  .item[aria-current='true'] .no { color: var(--accent); }
  /* 6px：紧贴上一行的左右按钮（原来 16px 是直接贴着卷轴时的间距） */
  /* ⚠️ position:relative 是给里面的 .lane-hint 当定位基准的，别删。 */
  .reel-hint { position: relative; margin: 6px 0 0; color: var(--fg-3); font-size: 12.5px; }
  /* 提示行两套文案：宽屏用长版，手机竖屏（≤640px）换成短版，见后面的窄屏档。
     短版默认 display:none —— 读屏不会念到它，也保证横屏的 innerText 一个字没变。 */
  .hint-narrow { display: none; }

  /* 「这一栏只有 1 条」提示条（2026-09-30）。
     绝对定位、不占布局 —— 出现和消失都不许推挤任何东西。
     pointer-events:none：它只是通知，不该抢点击，也不该挡住三维的悬停。
     ⚠️ 作者样式会盖掉 [hidden]（上面 .reel-hint 的兄弟规则同理），
        所以最后那条 `.lane-hint[hidden]` 必须留着，否则空药丸会一直挂在页面上。 */
  .lane-hint {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(4px);
    width: max-content;
    max-width: 82vw;
    padding: 8px 15px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--fg);
    font-size: 12.5px;
    line-height: 1.4;
    white-space: nowrap;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
  }
  .lane-hint.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .lane-hint[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .lane-hint { transition: none; transform: translateX(-50%); }
  }

  /* 右：选中项详情（sticky）
     2026-09-19 按要求改成**无边框**：去掉外框与底色，预览放大，文字收进一张暗色说明卡。 */
  .panel {
    position: sticky;
    top: 90px;
    border: 0;
    background: transparent;
    padding: 0;
  }
  .panel-media {
    aspect-ratio: 16 / 9;          /* mockup#2 占位框实测 709×389 ≈ 1.82 */
    border-radius: 14px;
    border: 0;
    background: var(--surface-2);
    overflow: hidden;
    display: grid; place-items: center;
    color: var(--fg-3); font-size: 12px;
  }
  /* 真封面（2026-09-19 接线）：填满 16:9 的框。
     ⚠️ 必须 object-fit:cover —— 封面比例五花八门（实测那张是 1600×730），拉伸会变形。
     ⚠️ 必须显式给 width/height 100% —— 容器是 place-items:center 的 grid，
        不给尺寸的话图片就按原始像素摆放，直接把框撑爆。 */
  .panel-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* ⚠️ 上面那句 `display: block` 会让 `hidden` 属性**失效** ——
     hidden 只是 UA 样式表里的 `display: none`，一条作者样式就盖掉了。
     后果：切到「没有封面」的条目时图片该藏没藏（框里留一块空白占位），
     而且没了 src 的 <img> 会把**上一条目的 alt** 当文字画出来
     （实测面板上会冒出「VOLT 系列武器设定」这种上一张的名字）。
     图片自己藏不干净，就在 CSS 这层摁回去。 */
  .panel-media img[hidden] { display: none; }
  /* 说明卡：mockup#2 里紧贴图片下沿的那块暗色圆角框。
     左边缘与图片对齐，而且**比图片窄**（mockup 实测 386~456px，图片 709px）——
     这个"台阶感"是刻意的，别顺手改成 100%。 */
  .panel-caption {
    margin-top: 6px;
    max-width: 62%;
    border-radius: 14px;
    background: var(--surface);
    padding: 12px 16px 16px;
  }
  .panel h3 { margin: 0 0 4px; font-size: clamp(17px, 1.1vw, 21px); }
  .panel-meta { margin: 0; color: var(--fg-3); font-size: 13px; }
  /* mockup#2 里正文是 22px @1920 的「大字说明」，两行就占满整块 —— 别按 14px 老值来 */
  .panel-desc { margin: 8px 0 0; color: var(--fg-2); font-size: clamp(14px, 1.15vw, 22px); line-height: 1.6; }
  /* 面板下载按钮：紧贴说明卡下方，左对齐；自带 .btn 样式，仅 downloadable 时由 JS 取消 hidden */
  .panel-dl { margin-top: 14px; }

  /* 「查看详情」按钮：Arrow.png 作箭头，**文字在箭头左边**（与箭头底边齐平，2026-09-19 改）。
     位置照 mockup#2：右边缘与右侧预览框**同一条线**（--sheet-pad），
     底边距视口下沿 87px @960。Arrow.png 原生 149×151，mockup 里就是原生尺寸，不再缩小。
     ⚠️ 按钮是 inline-flex 且整组右对齐（right: --sheet-pad）→ 换顺序后**箭头仍贴右边缘**，
     文字往左伸；整组宽度不变，所以不会多占地方。 */
  .detail-arrow {
    position: absolute;
    right: var(--sheet-pad);
    bottom: clamp(24px, 9.1vh, 87px);
    z-index: 6;
    display: inline-flex;
    align-items: flex-end;
    gap: 14px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--fg-2);
    font: inherit;
    font-size: clamp(14px, 0.95vw, 18px);
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: color var(--dur-fast) linear;
  }
  .detail-arrow img { display: block; width: clamp(72px, 7.7vw, 148px); height: auto; transition: transform var(--dur-std) var(--ease-out); }
  .detail-arrow span { padding-bottom: 2px; }
  .detail-arrow:hover { color: var(--fg); }
  .detail-arrow:hover img { transform: translate(3px, 3px); }
  .detail-arrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .btn {
    margin-top: 18px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 999px; border: 1px solid transparent;
    background: var(--accent); color: #08111f; font-weight: 600; font-size: 14px;
    cursor: pointer; font: inherit;
    transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-std) var(--ease-out);
  }
  .btn:hover { box-shadow: 0 14px 40px -18px var(--accent); }
  .btn:active { transform: translateY(1px); }
  /* ⚠️ 必须显式写：作者样式里的 display（上面那条 inline-flex）优先级高于 UA 的
     [hidden] { display: none }，只挂 hidden 属性的话按钮照样显示出来。
     这条是"没有 href 就别显示入口"能生效的前提。 */
  .btn[hidden] { display: none; }
  /* 详情页里"打开站内真实页面"的次要按钮：同尺寸、描边式，别抢主按钮的视觉权重 */
  .btn-ghost { background: transparent; color: var(--fg-2); border-color: var(--line-strong); }
  .btn-ghost:hover { color: var(--fg); box-shadow: none; }
  /* 面板切换：交叉淡入 */
  .panel-media, .panel h3, .panel-meta, .panel-desc { transition: opacity var(--dur-med) var(--ease-out); }
  .panel.swapping .panel-media,
  .panel.swapping h3,
  .panel.swapping .panel-meta,
  .panel.swapping .panel-desc { opacity: 0; }

  /* ============================================================
     详情页（点击选中项后）—— 过渡用共享元素
     ============================================================ */
  .detailview {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: var(--bg);
    overflow-y: auto;
    padding: clamp(40px, 8vh, 96px) 0;
  }
  .detailview[hidden] { display: none; }
  .detail-hero {
    view-transition-name: vt-card;              /* 与卡片同名 → 形变 */
    width: min(920px, 88vw);
    margin: 0 auto 28px;
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    border: 1px solid var(--line);
    background:
      radial-gradient(60% 90% at 30% 20%, rgba(106, 155, 255, 0.45), transparent 70%),
      radial-gradient(60% 90% at 80% 80%, rgba(196, 120, 255, 0.34), transparent 72%),
      var(--surface-2);
    display: grid; place-items: center;
  }
  .detail-hero span { font-size: clamp(28px, 5vw, 56px); font-weight: 700; letter-spacing: -0.02em; }
  .detail-body { width: min(920px, 88vw); margin: 0 auto; }
  .detail-body h1 { font-size: 26px; margin: 0 0 10px; }
  .detail-body p { color: var(--fg-2); }

  ::view-transition-old(vt-card),
  ::view-transition-new(vt-card) {
    animation-duration: 520ms;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
  }
  ::view-transition-old(root),
  ::view-transition-new(root) { animation-duration: 420ms; }

  /* ============================================================
     个人简介小窗口 —— 点左上角品牌**就地打开**（不跳页）
     ------------------------------------------------------------
     玻璃材质与第二屏的「返回主界面」(.return-bar) 同源
     （同一组 rgba + `blur(14px) saturate(170%)`），所以是一套观感。
     内容是活的：`/profile.json` ← 构建期由 content/profile/profile.md 出。
     ============================================================ */
  .meview {
    position: fixed;
    inset: 0;
    z-index: 60;                    /* 要压过 .detailview 的 40 */
    display: grid;
    place-items: center;
    padding: 5vh 4vw;
    background: rgba(4, 6, 10, 0.55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    animation: meviewIn 240ms var(--ease-out);
  }
  .meview[hidden] { display: none; }
  @keyframes meviewIn { from { opacity: 0; } to { opacity: 1; } }

  .meview-card {
    position: relative;
    width: min(880px, 92vw);
    max-height: 86vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: clamp(20px, 3.6vh, 34px) clamp(20px, 3vw, 36px);
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(17, 21, 28, 0.72);
    -webkit-backdrop-filter: blur(14px) saturate(170%);
    backdrop-filter: blur(14px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 40px 90px -40px rgba(0, 0, 0, 0.9);
    animation: meviewCardIn 260ms var(--ease-out);
  }
  @keyframes meviewCardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  .meview-close {
    position: absolute;
    top: 12px; right: 12px;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background var(--dur-fast) linear, border-color var(--dur-fast) linear;
  }
  .meview-close:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); }
  .meview-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 第一版排版：左栏 3:4 照片 + 右栏文字（与 /me/ 同一套比例） */
  .meview-grid {
    display: grid;
    grid-template-columns: minmax(160px, 240px) 1fr;
    gap: 28px;
    align-items: start;
  }
  .meview-photo img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .meview-photo-empty {
    aspect-ratio: 3 / 4;
    border: 1px dashed rgba(255, 255, 255, 0.22);
    border-radius: 14px;
    display: grid;
    place-content: center;
    gap: 8px;
    padding: 16px;
    text-align: center;
    color: var(--fg-3);
    font-size: 12.5px;
    line-height: 1.6;
  }
  .meview-photo-empty code { font-size: 11px; opacity: 0.85; }

  .meview-body h2 { margin: 0; font-size: 26px; letter-spacing: 0.01em; }
  .meview-role { margin: 7px 0 0; font-size: 13.5px; color: var(--fg-3); }
  .meview-prose { margin-top: 16px; color: var(--fg-2); font-size: 14.5px; line-height: 1.8; }
  .meview-prose h3 { margin: 20px 0 8px; font-size: 15.5px; color: var(--fg); }
  .meview-prose p { margin: 0 0 10px; }
  .meview-prose ul { margin: 0 0 12px; padding-left: 20px; }
  .meview-prose blockquote {
    margin: 14px 0;
    padding: 9px 14px;
    border-left: 2px solid rgba(255, 255, 255, 0.18);
    color: var(--fg-3);
  }
  .meview-prose code {
    font-size: 12.5px;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.09);
  }
  .meview-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

  @media (max-width: 640px) {
    .meview-grid { grid-template-columns: 1fr; gap: 20px; }
    .meview-photo { max-width: 220px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .meview, .meview-card { animation: none; }
  }

  @media (max-width: 820px) {
    /* 窄屏下 reel + 面板要竖着堆，总高会超过一屏。原来 .browse 是
       overflow:hidden + 垂直居中 → 顶部标题和栏目标签直接被裁到视口外。
       改成贴顶 + 内部可滚（触屏能滚，滚轮本来就被接管）。 */
    .browse {
      justify-content: flex-start;
      overflow-y: auto;
      overscroll-behavior: contain;
      /* 顶端那层窄屏只留返回条了（导航已于 2026-09-19 删掉），留白收一档；
         否则它会压到 h2 与栏目标签上。 */
      padding-top: clamp(104px, 15vh, 132px);
    }
    .browse-top { flex-direction: column; align-items: center; gap: 8px; }
    /* 窄屏是竖着堆的，"面板右移 30px" 那条没有意义，撤掉 */
    .browse-grid { grid-template-columns: 1fr; gap: 20px; padding-right: 0; }
    .panel { position: static; }
    .reel { height: 34svh; }
    .colswitch { margin-left: 0; }
    .panel-media { aspect-ratio: 16 / 9; }
    /* 窄屏字号回落，否则 32px 的栏目标签会换行成两排 */
    .coltab { font-size: 15px; padding: 6px 12px; }
    .colnav { width: 34px; height: 34px; font-size: 15px; }
    .colpos { font-size: 12.5px; }
    /* 窄屏大标题：仍是"其余栏目标题文字的 3 倍"（窄屏基准 40px → 120px），
       但上限收到 168，免得在 820px 宽的临界档上把栏目标签挤换行。 */
    :root { --title-size: clamp(120px, 19.8vw, 168px); }
    /* 窄屏是竖着堆 + 内部可滚的另一种版式，顶部留白是按"避开返回条"专门调过的，
       这里把桌面那套上移量撤掉，免得把它顶穿。 */
    :root { --head-lift: 0px; }
    /* 窄屏是竖着堆的，说明卡下面还有箭头但要再往下两屏 —— 不冲突，让它铺满 */
    .panel-caption { max-width: 100%; }
    .detail-arrow { bottom: clamp(16px, 4vh, 40px); }
    .detail-arrow img { width: clamp(56px, 15vw, 96px); }
  }

  /* 手机竖屏（≤640px）再收一档。
     上面那档（≤820px）是按 700~820 的横屏手机 / 小平板调的；到 390px 上实测：
     大标题 120px → 「项目」两字 240px = 62% 屏宽，还和右侧「N 个条目」挤在一行；
     再叠上 5 个栏目标签 + 两行长提示，卡片区被整个挤出视口。
     ⚠️ 只动这一档里的值，横屏（>640px）一条都没碰。 */
  @media (max-width: 640px) {
    /* 顶端只剩返回条（底边 y≈65），上下留白各收一档。
       2026-10-20 再收一档：390×844 实测 .browse 的 scrollHeight 857 > clientHeight 844，
       溢出的那 13px 正好把底部「查看详情」推出视觉区（按钮 802~847，屏高 844）——
       第二屏唯一的主行动点落在折线上，是这一档最该修的问题。
       配合下面 .reel 20svh→18svh，共腾出约 28px。 */
    .browse { padding: clamp(58px, 7vh, 76px) 0 8px; }
    /* 大标题仍保持「其余栏目标题文字的 3 倍」那档感觉，只是整体降一档 */
    :root { --title-size: clamp(60px, 17.5vw, 84px); }
    .browse-head { margin-bottom: 10px; }

    /* ============================================================
       竖屏专属的**堆叠顺序**（2026-10-21 用户拍板）
       ------------------------------------------------------------
       要求原话：「将封面和描述放在上面与栏目行"项目，图片，文档等"挨着。
       三维阵列的位置不动，左右切换栏目的按钮放在封面和描述下方。」

       目标自上而下：
         .browse-head（大标题 + 栏目标签）
         .panel（封面 + 标题/描述）
         .colswitch（← 1/5 →）
         .cols-viewport（阵列露出带）
         .reel-hint

       ⚠️ 为什么用 `display:contents` 而不是搬 DOM：
         `.panel` 是 `.browse-grid` 的第二个子元素，`.cols-viewport` / `.colswitch`
         都在 `.col-main` 里面 —— 两边不在同一层，光靠 `order` 排不出交错顺序。
         把 `.col-main` 拆成 `display:contents`，这些块就都变成 `.browse-grid` 的直接
         子元素，`order` 才管得到。**桌面版完全不受影响**（整段都在 ≤640 里），
         也就不存在"搬了 DOM 把 1440 双栏布局搞坏"的风险。

       ⚠️ 三维阵列本身是 `position:absolute; inset:0` 铺满 `.browse` 的，跟这里的
         文档流无关 —— 所以"阵列位置不动"自动成立：`PORTRAIT_PAN_LEFT/DOWN`
         （180/280）和 `setViewOffset` 一个数都没碰。这里动的只是**文字层**。
       ⚠️ 顺序靠 `order` 而不是 DOM，所以读屏/键盘 Tab 顺序仍是 DOM 顺序
         （标题 → 标签 → 卷轴 → 换栏 → 提示 → 封面），与桌面对齐，不制造无障碍回归。
       ============================================================ */
    .browse-grid { display: flex; flex-direction: column; gap: 0; }
    .col-main { display: contents; }
    .browse-head { order: 1; }
    .panel { order: 2; margin-top: 2px; }
    .colswitch { order: 3; margin-top: 10px; }
    .cols-viewport { order: 4; margin-top: 10px; }
    .reel-hint { order: 5; }
    /* 计数从标题右侧挪到标题下方 —— 竖屏没有横向余量可抢 */
    .head-row { flex-direction: column; align-items: flex-start; gap: 4px; }
    .head-tabs-row { margin-top: 8px; }
    .coltabs { gap: 4px; }
    .coltab { font-size: 14px; padding: 5px 10px; }
    /* 栏目标签实测 50×36、换栏按钮 34×34 —— 竖屏上最常点的两处都低于 44px。
       同样用伪元素补命中区：标签只往**竖直**扩（水平扩会和邻居重叠），按钮四周各 3px。
       视觉一个像素不动，所以不影响上面那条"要压进一屏"的高度账。 */
    .coltab { position: relative; }
    .coltab::after { content: ''; position: absolute; inset: -6px 0; }
    .colnav { position: relative; }
    .colnav::after { content: ''; position: absolute; inset: -6px -3px; }
    /* 提示行换短版（长版藏起来），字号行高各收一点 */
    .hint-wide { display: none; }
    .hint-narrow { display: inline; }
    .reel-hint { margin-top: 4px; font-size: 12px; line-height: 1.55; }
    /* 卷轴区收一档：三维阵列是整屏铺满的（不受这里影响），
       这一档只决定 DOM 版卷轴 / 说明面板的位置。
       20svh → 18svh 是给底部「查看详情」腾地方（见上面 .browse 那条）。 */
    .reel { height: 17svh; }
    .panel-media { aspect-ratio: 2.2 / 1; }
    /* 「查看详情」：竖屏从"浮在右下角"改成**静态一行**排在说明面板下方。
       浮动版在 390px 上正好压在描述文字最后一行上（实测箭头 751~810
       与描述文字 740~800 重叠），静态化之后位置稳定、也不再遮字。 */
    .detail-arrow {
      position: static;
      align-self: center;
      margin: 6px auto 0;
      gap: 8px;
      font-size: 13px;
    }
    .detail-arrow img { width: 44px; }
  }

  /* 短屏再收一档（≤640 宽 且 ≤780 高）—— 360×740 这类安卓机。
     实测 360×740：整摞内容 803px 高，而 .browse 只有 740，
     底部「查看详情」落在 758~803（整条在折线外），要滑 52px 才看得见。
     844 高的机型上不需要这一档（那里已经刚好压进一屏），所以用高度条件限住，
     **不联动上面的宽度档**。收紧的都是留白/比例，不动任何文字内容。 */
  @media (max-width: 640px) and (max-height: 780px) {
    .browse { padding-top: 52px; }
    .browse-head { margin-bottom: 8px; }
    /* ⚠️ 这里原来是 `.browse-grid { gap: 14px }`。竖屏改成 flex + `display:contents`
       之后，gap 会插在**全部 5 个块**之间（原来只在左栏和面板之间插一次），
       14×4 = 56px 白给出去。撤掉，改由下面各块的 margin 单独控。 */
    .panel { margin-top: 0; }
    .colswitch { margin-top: 8px; }
    .cols-viewport { margin-top: 8px; }
    .reel-hint { margin-top: 2px; }
    .reel { height: 15svh; }
    /* 封面框 2.2:1 → 3:1：矮屏上这个框只是"有条目就有图"的示意，占比可以小一档 */
    .panel-media { aspect-ratio: 3 / 1; }
  }

  /* 无障碍：关掉动效时一切照常可读，不做滚动劫持 */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    /* 第一屏现在是三维字母，它自己的动效由 JS 管，这里只剩底部那个滚动提示 */
    .foot-marker { animation: none !important; }
    *, *::before, *::after { transition-duration: 0.01ms !important; }
    /* 渐变揭示整套关掉，退回"能看见/看不见"两态。
       ⚠️ 这时**必须**靠 opacity 来藏：遮罩一旦摘掉，接管层就是常驻铺满视口的，
       没有 opacity 当开关它会一直盖在第一屏上。 */
    .browse {
      -webkit-mask-image: none !important;
              mask-image: none !important;
      opacity: 0;
      transform: none;
    }
    .browse.active { opacity: 1; }
  }
</style>
