<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 标题与首页入口上的标签「米米世界.exe」保持一致（原作品标题是「Minecraft JS 复刻版」） -->
<title>米米世界.exe</title>
<meta name="description" content="在浏览器里运行的 Minecraft 复刻作品：纯 JavaScript + WebGL2 从零实现，无引擎、无第三方库。">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #ui { pointer-events: none; }
  #textinput { position: absolute; display: none; background: transparent; border: none; outline: none; color: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; padding: 0 2px; text-shadow: 2px 2px 0 #3f3f3f; z-index: 5; }
  #err { position: absolute; left: 10%; top: 30%; width: 80%; color: #fff; font: 18px sans-serif; white-space: pre-wrap; display: none; text-align: center; }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: 16px "Microsoft YaHei", sans-serif; background: #ef323d; }

  /* 返回网站的出口 —— 2026-10-19 嵌入本站时加。
     为什么必须有：游戏会整屏接管，而站点访客（尤其手机）需要一个可见的退路。
     为什么做成"锁定时不可点"：鼠标被 Pointer Lock 抓走后光标是隐藏的，但点击仍然会落到
     元素上 —— 玩家转视角时随手一点就可能误触退出。所以 pointerlockchange 里把
     pointer-events 关掉，按 Esc 解锁后才恢复可点（那正是玩家想离开时的状态）。 */
  #backlink {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px;
    font: 13px/1 "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0.02em;
    color: #fff; text-decoration: none;
    background: rgba(12, 12, 14, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background 160ms ease, border-color 160ms ease, opacity 160ms ease;
  }
  #backlink:hover { background: rgba(24, 24, 28, 0.8); border-color: rgba(255, 255, 255, 0.45); }
  #backlink.is-locked { opacity: 0.28; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<input id="textinput" type="text" autocomplete="off" spellcheck="false">
<div id="boot">Minecraft JS 复刻版 · 正在加载…</div>
<div id="err"></div>
<a id="backlink" href="/" rel="home">← 返回网站</a>
<script src="js/assets.js"></script>
<script src="js/textures.js"></script>
<script src="js/util.js"></script>
<script src="js/blocks.js"></script>
<script src="js/world.js"></script>
<script src="js/mesher.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/entity.js"></script>
<script src="js/redstone.js"></script>
<script src="js/ui.js"></script>
<script src="js/save.js"></script>
<script src="js/game.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
<script>
  // hide boot splash once the title screen is up
  (function wait() { if (window.game && window.game.state !== 'boot') document.getElementById('boot').style.display = 'none'; else setTimeout(wait, 100); })();

  // 锁定鼠标时让「返回网站」变灰且不可点（理由见上面 CSS 注释）
  (function () {
    const link = document.getElementById('backlink');
    const sync = () => link.classList.toggle('is-locked', !!document.pointerLockElement);
    document.addEventListener('pointerlockchange', sync);
    sync();
  })();
</script>
</body>
</html>
